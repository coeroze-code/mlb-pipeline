name: Daily MLB Pipeline Run

on:
  schedule:
    # 13:00 UTC = 9:00 AM ET during daylight saving, 8:00 AM ET otherwise.
    # GitHub Actions cron is always UTC and does NOT auto-adjust for DST -
    # nudge this by an hour twice a year if you want a fixed local time,
    # or just leave it and accept the hour drift.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you also trigger a run manually from GitHub's website or mobile app

permissions:
  contents: write   # needed so the workflow can commit updated CSVs back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clean old result files
        run: |
          rm -f RBI.csv TB.csv RatingCalc.csv CombinedResults.csv
          rm -f ProbablePitchers_*.csv

      - name: Run pipeline
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
        run: python run_all.py

      - name: Commit updated results
        run: |
          git config user.name "mlb-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add RBI.csv TB.csv RatingCalc.csv ProbablePitchers_*.csv CombinedResults.csv
          git diff --quiet --cached || git commit -m "Automated data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
